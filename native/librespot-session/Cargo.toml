[package]
name = "streaming-spotify-session"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "=0.22.1"
flate2 = "=1.1.10"
futures-util = { version = "=0.3.34", features = ["sink"] }
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
url = "=2.5.8"
http = "=1.5.0"
http-body-util = "=0.1.5"
protobuf = "=3.7.2"
jni = "=0.21.1"
librespot-core = { git = "https://github.com/librespot-org/librespot", rev = "99b6088bf3ea028f90192676ac1a337fa4b2ed12", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-protocol = { git = "https://github.com/librespot-org/librespot", rev = "99b6088bf3ea028f90192676ac1a337fa4b2ed12" }
log = "=0.4.29"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
tokio = { version = "=1.49.0", features = ["rt", "rt-multi-thread", "time", "macros"] }
tokio-util = { version = "=0.7.18", features = ["rt"] }

[dev-dependencies]
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-webpki-roots"] }
tokio = { version = "=1.49.0", features = ["test-util"] }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
opt-level = "s"
panic = "unwind"
